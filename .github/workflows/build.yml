name: Build Rafiq Alhafiz APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o RafiqAlHafiz-AndroidStudio-Project.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -type f | head -n 1)")"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Alhafiz-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
